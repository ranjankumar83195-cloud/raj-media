<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAJ MEDIA - Gallery</title>
  <!-- Cloudinary Upload Widget Script -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .upload-btn {
      background-color: #d9534f;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .upload-btn:hover {
      background-color: #c9302c;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .card img, .card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .download-btn {
      display: inline-block;
      margin: 10px 0;
      padding: 8px 16px;
      background-color: #0275d8;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>RAJ MEDIA GALLERY</h1>
  
  <!-- अपलोड बटन -->
  <button id="upload_widget" class="upload-btn">📷 Photo / Video Upload Karein</button>

  <!-- गैलरी सेक्शन -->
  <div class="gallery" id="gallery"></div>

  <script>
    const cloudName = "wqzpnb7c";
    const uploadPreset = "raj_media_upload";

    // पहले से अपलोड की गई मीडिया को लोड करें
    let savedMedia = JSON.parse(localStorage.getItem('raj_media_items')) || [];
    renderGallery();

    const myWidget = cloudinary.createUploadWidget({
      cloudName: cloudName, 
      uploadPreset: uploadPreset,
      sources: ['local', 'camera', 'url'],
      multiple: true
    }, (error, result) => { 
      if (!error && result && result.event === "success") { 
        const fileUrl = result.info.secure_url;
        const resourceType = result.info.resource_type; // 'image' or 'video'

        savedMedia.unshift({ url: fileUrl, type: resourceType });
        localStorage.setItem('raj_media_items', JSON.stringify(savedMedia));
        renderGallery();
      }
    });

    document.getElementById("upload_widget").addEventListener("click", function(){
      myWidget.open();
    }, false);

    function renderGallery() {
      const galleryDiv = document.getElementById('gallery');
      galleryDiv.innerHTML = '';

      savedMedia.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        if (item.type === 'video') {
          card.innerHTML = `
            <video controls src="${item.url}"></video>
            <a href="${item.url}" target="_blank" class="download-btn" download>Download Video</a>
          `;
        } else {
          card.innerHTML = `
            <img src="${item.url}" alt="Raj Media Photo">
            <a href="${item.url}" target="_blank" class="download-btn" download>Download Photo</a>
          `;
        }

        galleryDiv.appendChild(card);
      });
    }
  </script>

</body>
</html>
